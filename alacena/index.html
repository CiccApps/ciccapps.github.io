<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alacena</title>
<meta name="description" content="Tu plan de comidas, tus recetas y tu compra. Una CiccApp.">
<meta name="theme-color" content="#F3EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120C15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alacena">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../iconos/alacena-180.png?v=1">
<link rel="icon" type="image/png" href="../iconos/alacena-192.png?v=1">
<link rel="stylesheet" href="../compartido/ciccapps.css?v=37">
<style>
/* Alacena: una carta de restaurante clásica. Mantel de vichy berenjena, plato de porcelana con filete de oro y cubertería de plata.
   La cabecera va dentro del mantel, con el plato: una sola pieza. Debajo, la carta del día; en el ordenador, en dos columnas. */
@font-face{font-family:"Bodoni Moda";src:url("../compartido/fuentes/BodoniModa-var.woff2") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url("../compartido/fuentes/BodoniModa-var-i.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Figtree";src:url("../compartido/fuentes/Figtree-var.woff2") format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("../compartido/fuentes/IBMPlexMono-500.woff2") format("woff2");font-weight:500;font-display:swap}
:root{
  --fondo:#F3EFE4;--alto:#FBF8F0;--hundido:#E9E3D3;--linea:#E0D9C8;--linea-f:#8F8A78;--tinta:#2A1A27;--suave:#6A5D66;
  --oro:#B8954A;--oro-t:#7E6024;--app-t:#4A2442;--prim:#4A2442;--sobre-prim:#F3EFE4;--exito:#2F6B45;--aviso:#8E5410;
  --lino:#ECE4D6;--vichy:rgba(74,36,66,.045);--servilleta:#FBF8F1;--velo:rgba(0,0,0,0);
  --sombra:0 1px 2px rgba(42,26,39,.06),0 8px 24px rgba(42,26,39,.06);
  --f-tit:"Bodoni Moda",Georgia,serif;--f-txt:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fondo:#120C15;--alto:#1C1420;--hundido:#261B2B;--linea:#33263A;--linea-f:#6E5E72;--tinta:#EDE6D3;--suave:#AA9EAA;
  --oro-t:#D9B878;--app-t:#C99BC0;--prim:#E0A23C;--sobre-prim:#120C15;--exito:#6FBF8A;--aviso:#E0A25A;
  --lino:#241A28;--vichy:rgba(201,155,192,.035);--servilleta:#E6DFD3;--velo:rgba(18,12,21,.10);
  --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --fondo:#120C15;--alto:#1C1420;--hundido:#261B2B;--linea:#33263A;--linea-f:#6E5E72;--tinta:#EDE6D3;--suave:#AA9EAA;
  --oro-t:#D9B878;--app-t:#C99BC0;--prim:#E0A23C;--sobre-prim:#120C15;--exito:#6FBF8A;--aviso:#E0A25A;
  --lino:#241A28;--vichy:rgba(201,155,192,.035);--servilleta:#E6DFD3;--velo:rgba(18,12,21,.10);
  --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f-txt);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fondo)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro-t);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
.cargando{padding:96px 0;text-align:center;color:var(--suave);font-family:var(--f-tit);font-style:italic;font-size:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ojo{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.ojo.oro{color:var(--oro-t)}
h2.tit{margin:0;font-family:var(--f-tit);font-weight:500;font-size:28px;line-height:32px;text-wrap:balance}
.suave{color:var(--suave)}
.p{margin:0}
.pila{display:flex;flex-direction:column;gap:12px}
.pila.g8{gap:8px}.pila.g24{gap:24px}
.tarjeta{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--linea);border-radius:8px;background:var(--alto)}
.aviso{padding:16px 18px;border-radius:8px;background:var(--hundido);font-size:14px;line-height:21px;text-wrap:pretty}
/* el aviso de salud, discreto: texto suelto, sin tarjeta */
.aviso-nutri{font-size:13.5px;line-height:20px;color:var(--suave)}
.aviso-nutri strong{font-weight:600;color:var(--tinta)}
/* el título grande de la marca: a este tamaño Bodoni deja los trazos finos casi invisibles; se usa un tamaño óptico menor */
.marca{font-family:var(--f-tit);font-weight:600;font-variation-settings:"opsz" 30}
.aviso strong{font-weight:600}

/* botones */
.btn{min-height:44px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;padding:0 14px;border:1px solid var(--linea-f);background:transparent;color:var(--tinta);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center;line-height:1.2}
.btn.prim{background:var(--prim);color:var(--sobre-prim);border-color:var(--prim)}
.btn.grande{min-height:48px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:default}
.fila2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fila3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.enlace{border:0;background:none;padding:6px;color:var(--suave);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pildora{display:inline-flex;align-items:center;min-height:30px;padding:4px 12px;border-radius:999px;border:1px solid var(--linea-f);font-size:12.5px;font-weight:600;color:var(--app-t);white-space:nowrap}
.pildora.tenue{border-color:var(--linea);color:var(--suave);font-weight:500}

/* pestañas: abajo en el móvil, arriba y centradas en el ordenador */
.pestanas{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--fondo);border-top:1px solid var(--linea);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.pest{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:0;background:transparent;color:var(--suave);font-size:11px;font-weight:600;cursor:pointer;padding:0}
.pest[aria-current="page"]{color:var(--app-t)}
body.con-pestanas{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  body.con-pestanas{padding-bottom:0}
  .pestanas{position:static;width:100%;max-width:640px;margin:0 auto;gap:4px;padding:4px;border:0;border-radius:12px;background:var(--hundido)}
  .pest{flex-direction:row;min-height:44px;border-radius:8px;font-size:14px}
  .pest svg{display:none}
  .pest[aria-current="page"]{background:var(--alto);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.12)}
}

/* la pieza: mantel con la cabecera y el plato */
.mantel{position:relative;border-radius:12px;overflow:hidden;line-height:0;background-color:var(--lino);background-image:radial-gradient(ellipse 75% 70% at 50% 52%,rgba(0,0,0,0) 55%,rgba(0,0,0,.16) 100%),linear-gradient(90deg,var(--vichy) 50%,transparent 50%),linear-gradient(var(--vichy) 50%,transparent 50%);background-size:100% 100%,14px 14px,14px 14px}
.mantel header{line-height:normal;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:30px 20px 0}
.mantel .fecha{font-family:var(--f-tit);font-size:13px;line-height:18px;font-weight:500;letter-spacing:.2em;color:var(--oro-t);text-transform:uppercase}
.mantel h1{margin:0;font-family:var(--f-tit);font-weight:600;font-variation-settings:"opsz" 30;font-size:clamp(50px,15vw,64px);line-height:1.02;letter-spacing:.01em;color:var(--app-t)}
.mantel .lema{margin:0;font-family:var(--f-tit);font-style:italic;font-size:22px;line-height:28px;color:var(--oro-t)}
.mantel svg.plato{width:100%;height:auto;display:block}
.alh-plato{font-family:var(--f-tit);font-size:11px;line-height:15px;color:#2A1A27;text-align:center;text-wrap:balance;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;hyphens:none}
.leyenda{margin:0;font-size:13px;line-height:19px;color:var(--suave);text-wrap:pretty}

/* hoy */
.dos{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.dos>.col{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:24px}
.cifras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--linea);border-radius:8px;background:var(--alto)}
.cifras div{display:flex;flex-direction:column;gap:2px;padding:12px;min-width:0}
.cifras div+div{border-left:1px solid var(--linea)}
.cifras b{font-family:var(--f-mono);font-weight:500;font-size:clamp(16px,5.1vw,20px);line-height:26px;white-space:nowrap}
.cifras span{font-size:12px;line-height:16px;color:var(--suave)}
.carta{display:flex;flex-direction:column;border:1px solid var(--linea);border-radius:8px;background:var(--alto);overflow:hidden}
.comida{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;padding:16px;border-top:1px solid var(--linea)}
.comida:first-child{border-top:0}
.comida .hora{font-family:var(--f-mono);font-size:13px;line-height:22px;color:var(--suave)}
.comida .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.comida .nom{font-family:var(--f-tit);font-size:12.5px;line-height:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--app-t)}
.comida .est{font-size:12px;line-height:22px;font-weight:600;white-space:nowrap}
.comida .est.hecha{color:var(--exito)}.comida .est.proxima{color:var(--aviso)}.comida .est.pendiente,.comida .est.fuera{color:var(--suave)}
.comida .plato{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-size:15px;line-height:21px;color:var(--tinta)}
.comida .meta{font-size:13px;line-height:19px;color:var(--suave)}
.comida .acc{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);gap:8px;margin-top:8px}
.comida .acc .btn{padding-left:6px;padding-right:6px;white-space:nowrap}
.comida .acc.dos-b{grid-template-columns:repeat(2,minmax(0,1fr))}
.art .pto{width:8px;height:8px;border-radius:50%;background:var(--oro-t);justify-self:center;align-self:center}
.tiendas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tiendas div{display:flex;flex-direction:column;padding:12px;border-radius:8px;background:var(--hundido);min-width:0}
.tiendas b{font-size:14px;font-weight:600}.tiendas span{font-size:13px;color:var(--suave)}

/* semana */
.dia{display:flex;flex-direction:column;border:1px solid var(--linea);border-radius:8px;background:var(--alto);overflow:hidden}
.dia>.cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 16px;background:var(--hundido)}
.dia>.cab b{font-family:var(--f-tit);font-weight:500;font-size:19px}
.dia>.cab span{font-family:var(--f-mono);font-size:12.5px;color:var(--suave)}
.dia.hoy>.cab b::after{content:" · hoy";font-family:var(--f-tit);font-style:italic;color:var(--oro-t)}
.linea{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;padding:10px 16px;border-top:1px solid var(--linea);align-items:baseline;width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;cursor:pointer}
.linea:first-of-type{border-top:0}
.linea .nom{font-family:var(--f-tit);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--app-t)}
.linea .pl{font-size:14.5px;line-height:20px}
.semanas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
@media (max-width:420px){.linea{grid-template-columns:92px minmax(0,1fr)}}

/* compra */
.seccion{display:flex;flex-direction:column;border:1px solid var(--linea);border-radius:8px;background:var(--alto);overflow:hidden}
.seccion h3{margin:0;padding:10px 16px;background:var(--hundido);font-family:var(--f-tit);font-weight:500;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.seccion h3 span{font-family:var(--f-txt);font-size:12.5px;color:var(--suave);font-weight:500}
.art{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--linea);cursor:pointer}
.seccion h3+.art{border-top:0}
.art input{width:20px;height:20px;margin:0;accent-color:var(--prim)}
.art .n{font-size:15px;line-height:20px}
.art .c{font-family:var(--f-mono);font-size:13px;color:var(--suave);white-space:nowrap}
.art.ok .n,.art.ok .c{text-decoration:line-through;color:var(--suave)}
.campo{font-size:16px;padding:11px 12px;border:1px solid var(--linea-f);border-radius:6px;background:var(--alto);color:var(--tinta);width:100%;min-width:0}
.campo::placeholder{color:var(--suave);opacity:1}
.anadir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

/* catálogo */
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--linea);align-items:center}
.cat:first-child{border-top:0}
.cat .n{font-size:14.5px;line-height:20px}
.cat .m{font-family:var(--f-mono);font-size:12px;color:var(--suave)}
.cat a{grid-row:1/3;grid-column:2}

/* cuestionario */
.cue{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:24px;padding-bottom:96px}
.cue .barra{height:4px;border-radius:2px;background:var(--hundido);overflow:hidden}
.cue .barra div{height:100%;background:var(--oro);transition:width .3s}
.cue .preg{display:flex;flex-direction:column;gap:8px}
.cue .preg>b{font-size:14px;line-height:20px;font-weight:600}
.cue .ayuda{font-size:13px;line-height:19px;color:var(--suave)}
.cue .nota{font-size:13px;line-height:19px;color:var(--oro-t)}
.cue .error{font-size:13px;line-height:19px;color:var(--aviso);font-weight:600}
.ops{display:grid;gap:8px}
.chip,.op{min-height:44px;padding:8px 4px;border:1px solid var(--linea-f);background:var(--alto);color:var(--tinta);font-size:14px;font-weight:500;line-height:1.2;cursor:pointer;min-width:0;border-radius:999px}
.op{border-radius:8px;text-align:left;padding:8px 12px}
.chip[aria-pressed="true"],.op[aria-pressed="true"]{background:var(--prim);color:var(--sobre-prim);border-color:var(--prim)}
.campos{display:grid;gap:8px}
.campos label{display:flex;flex-direction:column;gap:4px;min-width:0}
.campos label span{font-size:12px;line-height:16px;font-weight:600;color:var(--suave)}
.navcue{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--fondo);border-top:1px solid var(--linea);padding:12px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.navcue>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.eleccion{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px;border-radius:8px;background:var(--alto);color:var(--tinta);cursor:pointer;border:1px solid var(--linea)}
.eleccion.oro{border-color:var(--oro);box-shadow:var(--sombra)}
.eleccion b{font-family:var(--f-tit);font-weight:500;font-size:20px;line-height:25px}
.eleccion span{font-size:14px;line-height:21px;color:var(--suave)}
.subida{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px;border:1.5px dashed var(--linea-f);border-radius:12px;background:var(--alto);text-align:center}
.archivos{display:flex;flex-direction:column;gap:6px;width:100%}
.archivos div{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;padding:8px 12px;border:1px solid var(--linea);border-radius:6px;text-align:left}
.archivos div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.resumen{display:flex;flex-direction:column;border:1px solid var(--linea);border-radius:8px;background:var(--alto);overflow:hidden}
.resumen div{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-top:1px solid var(--linea)}
.resumen div:first-child{border-top:0}
.resumen b{font-size:12px;line-height:16px;font-weight:600;color:var(--suave)}
.resumen span{font-size:14px;line-height:20px}
.creando{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding:56px 0 24px}
.creando svg{animation:girar 9s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.creando svg{animation:none}}
.creando p{margin:0;font-family:var(--f-tit);font-style:italic;font-size:19px;color:var(--oro-t);min-height:28px}
.macro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--linea);border-radius:8px;background:var(--alto)}
.macro div{display:flex;flex-direction:column;align-items:center;padding:12px 4px;min-width:0}
.macro div+div{border-left:1px solid var(--linea)}
.macro b{font-family:var(--f-mono);font-weight:500;font-size:18px;white-space:nowrap}
.macro span{font-size:12px;color:var(--suave)}

/* ventanas emergentes: la pieza común de ciccapps.css (.cc-velo > .cc-hoja > .cc-cab); aquí, sus colores y el contenido */
.cc-hoja{background:var(--fondo);color:var(--tinta);box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.cc-sub{color:var(--suave);text-wrap:balance}
.cc-cab h2{font-family:var(--f-tit);font-weight:500;font-size:24px;line-height:29px;text-wrap:balance}
.cc-cerrar{color:var(--suave)}
.hoja-cuerpo{display:flex;flex-direction:column;gap:16px;padding-top:10px}
.hoja-cuerpo ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:22px}
.hoja-cuerpo ul{margin:0;padding-left:20px;font-size:15px;line-height:22px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--fondo);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 40px);text-align:center}
.pie{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pie .aviso-pie{margin:0;max-width:60ch;text-wrap:balance;font-size:13px;line-height:19px;color:var(--suave)}
/* el pie va dentro de la columna, que ya deja la franja segura: sin margen propio, para que quede centrado con el resto */
.cc-firma{padding-top:12px}
#app .cc-firma{padding-left:0;padding-right:0}
/* barra lateral: solo en la pantalla exterior del Duo, cuando la franja segura de la derecha deja sitio (44 px) */
.rail{z-index:9;display:none}
body.con-pestanas .rail.si{display:flex}
/* el Duo plegado difumina el borde de arriba aunque la franja segura sea 0: se baja el contenido */
/* Con la franja lateral (pantalla exterior del Duo): el contenido empieza a 20 px de arriba y los saltos dejan el mismo aire, como en Platea y la portada */
html.con-rail{scroll-padding-top:20px}
.rail button{appearance:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--linea);background:var(--alto);color:var(--suave);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.rail button.on{color:var(--app-t);border-color:var(--app-t)}

function lunesDe(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x}

#6F757C\" stroke-opacity=\".35\" stroke-width=\".5\"/><path d=\"M400 97.2C413.6 97.2 414 119 414 125C414 141.4 404 149 400 149C396 149 386 141.4 386 125C386 119 386.4 97.2 400 97.2Z\" fill=\"none\" stroke=\"#6F757C\" stroke-opacity=\".3\" stroke-width=\".6\"/><path d=\"M393.6 262.97A6.3999999999999995 6.72 0 0 0 406.4 262.97\" fill=\"none\" stroke=\"#6F757C\" stroke-opacity=\".35\" stroke-width=\".6\"/><\/g><g filter=\"url(#alhSombraPlato)\"><circle cx=\"214\" cy=\"170\" r=\"124\" fill=\"url(#alhLoza)\"/><\/g><circle cx=\"214\" cy=\"170\" r=\"123.4\" fill=\"none\" stroke=\"#D6CDBB\" stroke-width=\"1\"/><circle cx=\"214\" cy=\"170\" r=\"117\" fill=\"none\" stroke=\"url(#alhOro)\" stroke-width=\"2.6\"/><circle cx=\"214\" cy=\"170\" r=\"112.4\" fill=\"none\" stroke=\"url(#alhOro)\" stroke-width=\".8\"/><circle cx=\"214\" cy=\"170\" r=\"86\" fill=\"url(#alhFondoPlato)\"/><circle cx=\"214\" cy=\"170\" r=\"86\" fill=\"none\" stroke=\"#DED5C4\" stroke-width=\"1.4\"/><circle cx=\"214\" cy=\"170\" r=\"87.4\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1\"/><circle cx=\"214\" cy=\"170\" r=\"80\" fill=\"none\" stroke=\"url(#alhOro)\" stroke-width=\".6\"/><path d=\"M127.4 120a100 100 0 0 1 49-62.7\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"6\" stroke-linecap=\"round\" opacity=\".8\" filter=\"url(#alhBrillo)\"/>@@MARCAS@@<circle cx=\"214\" cy=\"170\" r=\"124\" style=\"fill: var(--velo)\"/>@@TEXTO@@";
function piezaHTML(est){
  const n=est.marcas.length;
  const marcas=est.marcas.map((m,i)=>{
    const a=(-90+360/n*i)*Math.PI/180,x=(214+100*Math.cos(a)).toFixed(1),y=(170+100*Math.sin(a)).toFixed(1);
    if(m==="hecha")return `<circle cx="${x}" cy="${y}" r="5.4" fill="#B8954A"/>`;
    if(m==="proxima")return `<circle cx="${x}" cy="${y}" r="4.8" fill="none" stroke="#D0922E" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="1.7" fill="#D0922E"/>`;
    return `<circle cx="${x}" cy="${y}" r="4.8" fill="none" stroke="#B8954A" stroke-width=".8"/>`;
  }).join("");
  const texto=`<text x="214" y="137" text-anchor="middle" style="font-family:'Bodoni Moda',Georgia,serif;font-size:8.5px;letter-spacing:1.8px;fill:#6A5D66">${esc(est.cuando)}</text>`+
    `<text x="214" y="161" text-anchor="middle" style="font-family:'Bodoni Moda',Georgia,serif;font-style:italic;font-size:22px;fill:#4A2442">${esc(est.comida)}</text>`+
    `<path d="M188 171h20M220 171h20" stroke="#B8954A" stroke-width=".7"/><path d="M214 168l3 3-3 3-3-3z" fill="#B8954A"/>`+
    `<foreignObject x="160" y="178" width="108" height="32"><div xmlns="http://www.w3.org/1999/xhtml" class="alh-plato">${esc(est.plato)}</div></foreignObject>`;
  const d=hoyFecha();
  return `<div class="mantel"><header><span class="fecha">${["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}</span><h1>Alacena</h1><p class="lema">¿Qué comemos hoy?</p>
<svg width="132" height="10" viewBox="0 0 132 10" aria-hidden="true" style="display:block;margin-top:4px"><path d="M0 5h56M76 5h56" stroke="#B8954A" stroke-width=".8"/><path d="M66 1l4 4-4 4-4-4z" fill="#B8954A"/><circle cx="58.5" cy="5" r="1.2" fill="#B8954A"/><circle cx="73.5" cy="5" r="1.2" fill="#B8954A"/></svg></header>
<svg class="plato" viewBox="0 0 430 340" role="img" aria-label="${esc(est.aria)}">${PLATO_SVG.replace("@@MARCAS@@",marcas).replace("@@TEXTO@@",texto)}</svg></div>`;
}

/* ---------- datos del plan ---------- */
const plato=id=>PLAN&&PLAN.platos.find(p=>p.id===id)||null;
function menuDe(letra){
  if(!PLAN)return[];
  const d=(PLAN.dias||[]).find(z=>z.dia===letra)||{menu:[]};
  return (PLAN.comidas||[]).map(c=>{const m=d.menu.find(x=>x.comida===c.clave);return m?{comida:c,plato:plato(m.plato)}:null}).filter(x=>x&&x.plato);
}
const regDe=(fecha,clave)=>REG[fecha+"|"+clave]||null;
function estadoHoy(){
  const f=ISO(hoyFecha()),menu=menuDe(LETRAS[hoyFecha().getDay()]);
  let prox=-1;
  const est=menu.map((m,i)=>{const r=regDe(f,m.comida.clave);if(r)return r.estado==="fuera"?"fuera":"hecha";if(prox<0){prox=i;return"proxima"}return"pendiente"});
  return {menu,est,prox};
}
const kcalDia=letra=>menuDe(letra).reduce((s,m)=>s+(m.plato.kcal||0),0);

/* ---------- vistas ---------- */
const PESTANAS=[
  ["hoy","Hoy",'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/>'],
  ["semana","Semana",'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'],
  ["compra","Compra",'<path d="M5 8h14l-1.5 11h-11z"/><path d="M9 8a3 3 0 0 1 6 0"/>'],
  ["fuera","Fuera",'<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>'],
  ["plan","Tu plan",'<path d="M7 4h10v16H7z"/><path d="M10 9h4M10 13h4"/>'],
];
function pintaPestanas(){
  const n=$("pestanas");
  n.innerHTML=PESTANAS.map(([k,t,ico])=>`<button class="pest" data-v="${k}"${VISTA===k?' aria-current="page"':""}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ico}</svg>${t}</button>`).join("");
  n.querySelectorAll(".pest").forEach(b=>b.onclick=()=>ir(b.dataset.v));
  // la barra lateral del Duo: Arriba y las mismas secciones, con la que se está viendo iluminada
  const r=$("rail");
  r.innerHTML=`<button type="button" data-ir="arriba" aria-label="Arriba" title="Arriba"><svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>`+
    PESTANAS.map(([k,t,ico])=>`<button type="button" data-ir="${k}" aria-label="${t}" title="${t}"${VISTA===k?' class="on" aria-current="page"':""}><svg viewBox="0 0 24 24">${ico}</svg></button>`).join("");
  r.querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>{scrollTo(scrollX,scrollY);b.dataset.ir==="arriba"?scrollTo({top:0,behavior:"smooth"}):ir(b.dataset.ir)});
}
// dónde va la barra lo decide compartido/rail.js; sin botón en el iPhone, que ya tiene abajo las pestañas con las mismas secciones
ccRail($("rail"),{junto:()=>document.querySelector(".wrap"),boton:false});
function ir(v){VISTA=v;pinta();window.scrollTo(0,0)}
function pinta(){
  const app=$("app");
  if(CUE){$("pestanas").hidden=true;document.body.classList.remove("con-pestanas");pintaCuestionario();return}
  if(!PLAN){$("pestanas").hidden=true;document.body.classList.remove("con-pestanas");app.innerHTML=inicioHTML();enlazaInicio();return}
  $("pestanas").hidden=false;document.body.classList.add("con-pestanas");pintaPestanas();
  // en el ordenador las pestañas van arriba, dentro de la columna
  const escritorio=matchMedia("(min-width:900px)").matches;
  const nav=$("pestanas");
  if(escritorio&&nav.parentElement!==app)app.before(nav);
  if(!escritorio&&nav.parentElement!==document.body)document.body.appendChild(nav);
  const v={hoy:vistaHoy,semana:vistaSemana,compra:vistaCompra,fuera:vistaFuera,plan:vistaPlan}[VISTA]||vistaHoy;

/* lista de la compra: suma de los ingredientes de toda la semana, por secciones */
function listaCompra(){
  const items={},pedir={};
  if(PLAN)for(const l of DIAS)for(const m of menuDe(l)){
    const p=m.plato;
    if(p.catalogo){pedir[p.catalogo]=pedir[p.catalogo]||{ref:p.catalogo,nombre:p.nombre,veces:0};pedir[p.catalogo].veces++;continue}
    for(const i of p.ingredientes||[]){
      const u=String(i.unidad||"").toLowerCase().trim(),k=(String(i.nombre).toLowerCase().trim()+"|"+u);
      items[k]=items[k]||{k,nombre:i.nombre,unidad:u,cantidad:0,seccion:ORDEN_SECCIONES.includes(i.seccion)?i.seccion:"Otros"};
      items[k].cantidad+=Number(i.cantidad)||0;
    }
  }
  for(const e of COMPRA.extra||[])items["extra|"+e]={k:"extra|"+e,nombre:e,unidad:"",cantidad:0,seccion:"Otros",extra:true};
  const lista=Object.values(items).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  const secciones=ORDEN_SECCIONES.filter(s=>lista.some(x=>x.seccion===s));
  return {items:lista,secciones,pedir:Object.values(pedir)};
}
function cantidad(x){
  if(!x.cantidad)return"";
  let c=x.cantidad,u=x.unidad;
  if(u==="g"&&c>=1000){c=c/1000;u="kg"}
  if(u==="ml"&&c>=1000){c=c/1000;u="l"}
  if(u==="ud"||u==="uds"||u==="unidad"||u==="unidades"){c=Math.ceil(c);u=c===1?"ud":"uds"}
  else c=u==="kg"||u==="l"?Math.round(c*10)/10:Math.round(c/5)*5||Math.round(c);
  return c.toLocaleString("es-ES")+" "+u;
}

function enlaza(){
  const app=$("app");
  app.querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>ir(b.dataset.ir));
  app.querySelectorAll("[data-receta]").forEach(b=>b.onclick=()=>hojaPlato(b.dataset.receta));
  app.querySelectorAll("[data-hecha]").forEach(b=>b.onclick=()=>marcar(b.dataset.hecha,"hecha"));
  app.querySelectorAll("[data-fuera]").forEach(b=>b.onclick=()=>marcar(b.dataset.fuera,"fuera"));
  app.querySelectorAll("[data-deshacer]").forEach(b=>b.onclick=()=>deshacer(b.dataset.deshacer));
  app.querySelectorAll("[data-cambiar]").forEach(b=>b.onclick=()=>hojaCambiar(b.dataset.cambiar));
  app.querySelectorAll("[data-art]").forEach(c=>c.onchange=()=>marcaArticulo(c.dataset.art,c.checked));
  app.querySelectorAll("[data-quitar]").forEach(b=>b.onclick=e=>{e.preventDefault();quitaExtra(b.dataset.quitar)});
  app.querySelectorAll("[data-fcat]").forEach(b=>b.onclick=()=>{window.__fCat=b.dataset.fcat;pinta()});
  const f=$("anadir");if(f)f.onsubmit=e=>{e.preventDefault();const v=$("extra").value.trim();if(v)anadeExtra(v)};
  app.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.acc;
    if(a==="salir")CiccCuenta.salir();
    if(a==="crear"||a==="rehacer")abreCuestionario("paso",0);
    if(a==="respuestas")abreCuestionario("paso",0);
    if(a==="importar")abreCuestionario("importar");
    if(a==="copiar")copiaLista();
    if(a==="reiniciar"){COMPRA.marcados=[];guardaCompra();pinta()}
    if(a==="borrar")borraDatos();
  });
}

// borra todo lo de Alacena de esta cuenta (cada tabla solo deja tocar las filas propias)
async function borraDatos(){
  if(!confirm("¿Borrar todos tus datos de Alacena? Se borran tus respuestas, tus planes, las recetas guardadas, la compra y lo que has marcado. No se puede deshacer."))return;
  for(const t of["alacena_recetas","alacena_registro","alacena_compra","alacena_planes","alacena_perfil"]){
    const r=await sb.from(t).delete().not("user_id","is",null);
    if(r.error){toast("No se han podido borrar. Revisa la conexión y vuelve a probar.");return}
  }
  try{localStorage.removeItem("alacena-cat")}catch(_){}
  PERFIL=null;PLAN=null;REG={};RECETAS={};COMPRA={marcados:[],extra:[]};VISTA="hoy";
  pinta();window.scrollTo(0,0);toast("Tus datos de Alacena se han borrado");
}

async function marcar(clave,estado){
  const fecha=ISO(hoyFecha()),m=menuDe(LETRAS[hoyFecha().getDay()]).find(x=>x.comida.clave===clave);
  const fila={fecha,comida:clave,estado,plato:m?m.plato.nombre:null};
  REG[fecha+"|"+clave]=fila;pinta();
  const r=await sb.from("alacena_registro").upsert(fila,{onConflict:"user_id,fecha,comida"});
  if(r.error){delete REG[fecha+"|"+clave];pinta();toast("No se ha podido guardar");return}
  if(estado==="fuera"&&(PLAN.fuera||[]).length)hojaFuera();
}
async function deshacer(clave){
  const fecha=ISO(hoyFecha()),prev=REG[fecha+"|"+clave];
  delete REG[fecha+"|"+clave];pinta();
  const r=await sb.from("alacena_registro").delete().eq("fecha",fecha).eq("comida",clave);
  if(r.error){REG[fecha+"|"+clave]=prev;pinta();toast("No se ha podido deshacer")}
}

let tmCompra;function guardaCompra(){clearTimeout(tmCompra);tmCompra=setTimeout(async()=>{
  const r=await sb.from("alacena_compra").upsert({semana:ISO(lunesDe(hoyFecha())),marcados:COMPRA.marcados,extra:COMPRA.extra,actualizado:new Date().toISOString()},{onConflict:"user_id,semana"});
  if(r.error)toast("No se ha podido guardar la lista");
},500)}
function marcaArticulo(k,ok){COMPRA.marcados=COMPRA.marcados.filter(x=>x!==k);if(ok)COMPRA.marcados.push(k);guardaCompra();pinta()}
function anadeExtra(v){COMPRA.extra=[...(COMPRA.extra||[]).filter(x=>x!==v),v.slice(0,80)];guardaCompra();pinta()}
function quitaExtra(k){const v=k.slice(6);COMPRA.extra=(COMPRA.extra||[]).filter(x=>x!==v);COMPRA.marcados=COMPRA.marcados.filter(x=>x!==k);guardaCompra();pinta()}
async function copiaLista(){
  const L=listaCompra();
  const t=L.secciones.map(s=>s.toUpperCase()+"\n"+L.items.filter(x=>x.seccion===s&&!COMPRA.marcados.includes(x.k)).map(x=>"· "+x.nombre+(x.cantidad?" ("+cantidad(x)+")":"")).join("\n")).filter(b=>b.includes("·")).join("\n\n");
  try{await navigator.clipboard.writeText(t||"Nada por comprar");toast("Lista copiada")}catch(_){toast("No se ha podido copiar")}
}

/* ---------- hojas ---------- */
function hoja(cab,html){
  const raiz=$("hojas");
  raiz.innerHTML=`<div class="cc-velo" id="hojaFondo"><div class="cc-hoja" role="dialog" aria-modal="true" tabindex="-1">${cab}<div class="cc-cuerpo hoja-cuerpo">${html}</div></div></div>`;
  const fondo=$("hojaFondo"),h=fondo.querySelector(".cc-hoja");
  void fondo.offsetHeight;fondo.classList.add("cc-dentro");document.documentElement.classList.add("cc-abierta");
  const cerrar=()=>{document.removeEventListener("keydown",tecla);fondo.classList.remove("cc-dentro");document.documentElement.classList.remove("cc-abierta");setTimeout(()=>fondo.remove(),300)};
  const tecla=e=>{if(e.key==="Escape")cerrar()};
  document.addEventListener("keydown",tecla);
  fondo.onclick=e=>{if(e.target===fondo)cerrar()};
  fondo.querySelectorAll("[data-cerrar]").forEach(b=>b.onclick=cerrar);
  h.cerrar=cerrar;h.focus({preventScroll:true});
  return h;
}

/* ---------- IA ---------- */
async function ia(cuerpo){
  const r=await sb.functions.invoke("alacena",{body:cuerpo});
  if(r.error){
    let m="La IA no ha podido responder. Prueba en un rato.";
    try{const j=await r.error.context.json();if(j&&j.mensaje)m=j.mensaje}catch(_){}
    throw new Error(m);
  }
  return r.data;
}

async function accionCue(a){

    if(c.vista==="paso"&&c.i>0)c.i--;

  }
  if(a==="siguiente"){
    const e=valida(c.i);if(e){c.error=e;pintaCuestionario();return}
    if(c.i<PASOS.length-1)c.i++;else c.vista="fin";
    pintaCuestionario();window.scrollTo(0,0);return;

  if(a==="crear"){
    c.vista="creando";pintaCuestionario();window.scrollTo(0,0);
    const frases=["Calculando lo que necesitas…","Eligiendo platos que te gustan…",`Ajustando las recetas a ${((c.r.aparatos||[])[0]||"tu cocina").toLowerCase().replace(/^airfryer$/,"tu airfryer")}…`,"Repartiendo la semana…","Sumando la lista de la compra…","Poniendo la mesa…"];
    let k=0;const tm=setInterval(()=>{k=(k+1)%frases.length;const f=$("frase");if(f)f.textContent=frases[k]},7000);
    sb.from("alacena_perfil").upsert({respuestas:c.r,actualizado:new Date().toISOString()},{onConflict:"user_id"}).then(()=>{});
    PERFIL=c.r;
    try{const d=await ia({accion:"crear",respuestas:c.r});c.plan=d.plan;c.vista="revisar";c.error=""}
    catch(e){c.vista="fin";c.error=e.message}
    clearInterval(tm);if(CUE===c){pintaCuestionario();window.scrollTo(0,0)}return;
  }
  if(a==="convertir"){
    c.vista="creando";pintaCuestionario();window.scrollTo(0,0);
    const frases=["Leyendo la dieta de tu nutricionista…","Ordenando comidas y horarios…","Respetando cada cantidad…","Sumando la lista de la compra…"];
    let k=0;const tm=setInterval(()=>{k=(k+1)%frases.length;const f=$("frase");if(f)f.textContent=frases[k]},7000);
    try{const d=await ia({accion:"importar",archivos:c.archivos.map(x=>({tipo:x.tipo,media:x.media,datos:x.datos})),respuestas:PERFIL||{}});c.plan=d.plan;c.vista="revisar";c.error=""}
    catch(e){c.vista="importar";c.error=e.message}
    clearInterval(tm);if(CUE===c){pintaCuestionario();window.scrollTo(0,0)}return;
  }
  if(a==="otra"){c.vista=c.origen==="nutricionista"?"importar":"fin";c.plan=null;pintaCuestionario();return}
  if(a==="guardar"){
    const p=c.plan;
    const b=document.querySelector('[data-cue="guardar"]');if(b){b.disabled=true;b.textContent="Guardando…"}
    await sb.from("alacena_planes").update({activo:false}).eq("activo",true);
    const r=await sb.from("alacena_planes").insert({origen:c.origen,activo:true,objetivo:p.objetivo,comidas:p.comidas,platos:p.platos,dias:p.dias,fuera:p.fuera,consejos:p.consejos,notas:p.notas}).select().single();
    if(r.error){c.error="No se ha podido guardar. Vuelve a intentarlo.";pintaCuestionario();return}
    PLAN=r.data;RECETAS={};COMPRA={marcados:[],extra:COMPRA.extra||[]};guardaCompra();
    CUE=null;VISTA="hoy";pinta();window.scrollTo(0,0);toast("Tu plan está listo");
  }
}
async function leeArchivos(lista){
  const c=CUE;
  for(const f of Array.from(lista||[])){
    if(c.archivos.length>=10){c.error="Como mucho, 10 archivos.";break}
    try{
      if(f.type==="application/pdf"){
        if(f.size>12e6){c.error="El PDF es demasiado grande (máximo 12 MB).";continue}
        c.archivos.push({nombre:f.name,tipo:"pdf",media:f.type,datos:await b64(f)});
      }else if(/^image\//.test(f.type)){
        c.archivos.push({nombre:f.name||"Foto",tipo:"imagen",media:"image/jpeg",datos:await reduce(f)});
      }
    }catch(_){c.error="No se ha podido leer "+f.name+"."}
  }
  pintaCuestionario();
}
const b64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(f)});
// las fotos se reducen a 1800 px y JPEG: se leen igual de bien y pesan mucho menos
async function reduce(f){
  const img=await createImageBitmap(f);
  const k=Math.min(1,1800/Math.max(img.width,img.height));
  const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL("image/jpeg",.85).split(",")[1];
}

async function cargar(){
  const lunes=lunesDe(hoyFecha()),dom=new Date(lunes);dom.setDate(dom.getDate()+6);
  const [p,pl,rg,cp]=await Promise.all([
    sb.from("alacena_perfil").select("respuestas").maybeSingle(),
    sb.from("alacena_planes").select("*").eq("activo",true).order("creado",{ascending:false}).limit(1).maybeSingle(),
    sb.from("alacena_registro").select("fecha,comida,estado,plato").gte("fecha",ISO(lunes)).lte("fecha",ISO(dom)),
    sb.from("alacena_compra").select("marcados,extra").eq("semana",ISO(lunes)).maybeSingle(),
  ]);
  if(pl.error){$("app").innerHTML='<p class="cargando">No se ha podido abrir la alacena. Revisa la conexión y vuelve a entrar.</p>';return}
  PERFIL=p.data?p.data.respuestas:null;
  PLAN=pl.data||null;
  REG={};(rg.data||[]).forEach(r=>REG[r.fecha+"|"+r.comida]=r);
  COMPRA=cp.data?{marcados:cp.data.marcados||[],extra:cp.data.extra||[]}:{marcados:[],extra:[]};
  if(PLAN){const rc=await sb.from("alacena_recetas").select("clave,receta").eq("plan_id",PLAN.id);RECETAS={};(rc.data||[]).forEach(x=>RECETAS[x.clave]=x.receta)}
  pinta();
  cargaCatalogo();
}
async function cargaCatalogo(){

  try{const h=ISO(new Date());if(localStorage.getItem("alacena-cat")!==h){localStorage.setItem("alacena-cat",h);await sb.functions.invoke("catalogos",{body:{}})}}catch(_){}
  const r=await sb.from("alacena_catalogo").select("fuente,ref,nombre,kcal,proteinas,hidratos,grasas,precio,url,disponible,visto");
  CAT=r.data||[];
  if(!CUE&&PLAN&&(VISTA==="plan"||VISTA==="compra"))pinta();
}
