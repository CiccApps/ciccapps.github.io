<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Taquilla</title>
<meta name="description" content="Diario de cine y series. Una CiccApp.">
<meta name="theme-color" content="#F3EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150D10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Taquilla">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../iconos/la-taquilla-180.png?v=2">
<link rel="icon" type="image/png" href="../iconos/la-taquilla-192.png?v=2">
<link rel="stylesheet" href="../compartido/ciccapps.css?v=9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: marquesina de cine arriba (estadísticas en letras de cartel), pestañas Diario / Por ver / Series, entradas como "tickets" troquelados; formulario en hoja inferior */
:root{
  --bg:#F3EFE4; --card:#FFFFFF; --ink:#24161A; --muted:#6C6266; --line:#E0D7C6;
  --red:#6E1E2B; --red-soft:#F1DEDC; --bulb:#B8913F; --stub:#EDE5D6; --ok:#2E6B4F;
  --f-display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150D10; --card:#1F1518; --ink:#F1E9E4; --muted:#A7999E; --line:#3A2A2F;
  --red:#D27A86; --red-soft:#3A1C22; --bulb:#D9B878; --stub:#2A1C20; --ok:#6CC198; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150D10; --card:#1F1518; --ink:#F1E9E4; --muted:#A7999E; --line:#3A2A2F;
  --red:#D27A86; --red-soft:#3A1C22; --bulb:#D9B878; --stub:#2A1C20; --ok:#6CC198; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.pie-acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px}
.pie-acc .chip{width:100%}
.salir{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);cursor:pointer;padding:6px}
.cargando{padding:48px 0;text-align:center;color:var(--muted)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:0}

.marquee{border-radius:10px;background:radial-gradient(120% 140% at 25% 15%,#8A2A3A,#5E1A26 55%,#3A0E17);color:#FFF6EE;padding:18px 20px 16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.marquee::before,.marquee::after{content:"";position:absolute;left:10px;right:10px;height:6px;background:radial-gradient(circle,var(--bulb) 2.2px,transparent 2.6px) 0 0/14px 6px repeat-x}
.marquee::before{top:6px}.marquee::after{bottom:6px}
.marquee h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,11vw,72px);line-height:.9;letter-spacing:.02em;margin:6px 0 0}
.marquee .sub{font-size:13px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{display:flex;flex-direction:column;border-left:1px solid rgba(255,246,238,.35);padding-left:10px;min-width:0}
.stats b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1}
.stats span{font-size:11.5px;opacity:.85}
@media (max-width:520px){.stats{gap:6px}.stats div{padding-left:7px}.stats b{font-size:28px}.stats span{font-size:10.5px;line-height:1.25}.marquee{padding:16px 16px 18px}}

.bar{display:flex;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px}
.tabs{display:flex;gap:4px;background:var(--stub);padding:4px;border-radius:10px;flex:1;min-width:0}
.tab{flex:1;padding:9px 4px;white-space:nowrap;border:none;border-radius:7px;background:transparent;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tab .ct{font-family:var(--f-mono);font-size:11px;color:var(--red);margin-left:4px}
@media (max-width:400px){.addtxt{display:none}.add{padding:11px 15px;font-size:18px;line-height:1}.tab{font-size:13px}}
.add{border:none;background:var(--ink);color:var(--bg);font-weight:700;padding:11px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);color:#FFF6EE;border-color:var(--red)}
:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}

.month{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;color:var(--muted);margin:8px 0 -6px}
.tickets{display:flex;flex-direction:column;gap:10px}
.ticket{display:grid;grid-template-columns:64px 1fr;background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;width:100%;padding:0;overflow:hidden;position:relative}
.ticket .stub{background:var(--stub);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border-right:2px dashed var(--line);gap:0}
.ticket .stub b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:400}
.ticket .stub span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ticket .body{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ticket h3{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.ticket .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ticket .rev{font-size:13.5px;color:var(--ink);opacity:.85;margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--bulb);letter-spacing:1px;font-size:13px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--red-soft);color:var(--red)}
.badge.alt{background:var(--stub);color:var(--muted)}
.prog{height:4px;background:var(--stub);border-radius:2px;overflow:hidden;margin-top:6px;max-width:260px}
.prog i{display:block;height:100%;background:var(--red)}
.empty{border:2px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;letter-spacing:.03em}
.empty p{margin:0;color:var(--muted);max-width:44ch}

.sheet-bg{position:fixed;inset:0;background:rgba(10,6,8,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:12px 12px 0 0;max-height:92%;overflow:auto;border-top:5px solid var(--red);
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;letter-spacing:.03em;line-height:1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:8px}
.seg button{flex:1;font-size:13px;padding:8px 4px;border:none;border-radius:6px;background:transparent;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700}
.rate{display:flex;align-items:center;gap:10px}
.rate input{flex:1;accent-color:var(--bulb)}
.rate output{font-family:var(--f-mono);min-width:70px;color:var(--bulb)}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--red)}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{font-weight:700;font-size:14px;padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--red);border-color:transparent;padding-left:0}
.links{display:flex;gap:16px;flex-wrap:wrap}
.links a{color:var(--red);font-weight:700;font-size:14px;text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;white-space:nowrap}
footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
</style>

</head>
<body>
<div class="wrap">
  <section class="marquee" aria-label="Resumen">
    <span class="eyebrow" style="color:#FFF6EE;opacity:.8;margin-top:6px">Cada película, una entrada</span>
    <h1>La Taquilla</h1>
    <div class="stats">
      <div><b id="stYear" class="mono">0</b><span>películas este año</span></div>
      <div><b id="stCine" class="mono">0</b><span>en el cine este mes</span></div>
      <div><b id="stQueue" class="mono">0</b><span>por ver</span></div>
      <div><b id="stSeries" class="mono">0</b><span>series en curso</span></div>
    </div>
  </section>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-diario" data-tab="diario" aria-selected="true">Diario</button>
      <button class="tab" role="tab" id="tab-porver" data-tab="porver" aria-selected="false">Por ver<span class="ct" id="ctQ"></span></button>
      <button class="tab" role="tab" id="tab-series" data-tab="series" aria-selected="false">Series<span class="ct" id="ctS"></span></button>
    </div>
    <button class="add" id="addBtn" aria-label="Añadir">+<span class="addtxt"> Añadir</span></button>
  </div>

  <div id="view" style="display:flex;flex-direction:column;gap:16px"><p class="cargando">Abriendo la taquilla…</p></div>

  <footer id="pie" style="flex-direction:column;align-items:center">
    <div class="pie-acc"><button class="chip" id="expDiary">Exportar diario</button><button class="chip" id="expWatch">Exportar watchlist</button></div>
    <span id="sync" style="text-align:center">Archivos CSV para importar en Letterboxd · sincronizado en todos tus dispositivos.</span>
    <button class="salir" id="salir">Cerrar sesión</button>
  </footer>
</div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="../compartido/supabase.js"></script>
<script src="../compartido/cuenta.js?v=9"></script>
<script>
const MOODS={risa:"Reírme",tension:"Tensión",pensar:"Pensar",llorar:"Emocionarme",accion:"Acción",epico:"Épica",ligera:"Ligera",clasico:"Clásico pendiente"};
const WHERE={cine:"Cine",streaming:"Streaming",casa:"En casa"};
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let items={};let tab="diario";let mood=null;let sb=null;let listo=false;
const LS="sala-miguel-v1";
try{const t=localStorage.getItem(LS+"-tab");if(t)tab=t}catch(e){}
/* filas de la base de datos <-> entradas */
const deFila=r=>({tipo:r.tipo,estado:r.estado,titulo:r.titulo,anio:r.anio?String(r.anio):"",donde:r.donde||"",plataforma:r.plataforma||"",fecha:r.fecha||"",nota:+r.nota||0,resena:r.resena||"",rewatch:r.rewatch,moods:r.moods||[],prio:r.prio,temp:r.temporada||"",cap:r.capitulo||"",temps:r.temporadas||"",creado:r.creado});
const aFila=x=>({tipo:x.tipo,estado:x.estado,titulo:x.titulo,anio:parseInt(x.anio,10)||null,donde:x.donde||null,plataforma:x.plataforma||null,fecha:x.fecha||null,nota:x.nota||null,resena:x.resena||null,rewatch:!!x.rewatch,moods:x.moods||[],prio:!!x.prio,temporada:+x.temp||null,capitulo:+x.cap||null,temporadas:+x.temps||null});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const stars=n=>n?"★".repeat(Math.floor(n))+(n%1?"½":""):"";
const lb=x=>`https://letterboxd.com/search/${encodeURIComponent(x.titulo+(x.anio?" "+x.anio:""))}/`;
const jw=x=>`https://www.justwatch.com/es/buscar?q=${encodeURIComponent(x.titulo)}`;
const all=()=>Object.entries(items).map(([id,x])=>Object.assign({id},x));

function render(){
  if(!listo)return;
  const L=all();const y=today().slice(0,4),m=today().slice(0,7);
  const seen=L.filter(x=>x.tipo==="peli"&&x.estado==="vista");
  document.getElementById("stYear").textContent=seen.filter(x=>(x.fecha||"").startsWith(y)).length;
  document.getElementById("stCine").textContent=seen.filter(x=>x.donde==="cine"&&(x.fecha||"").startsWith(m)).length;
  const q=L.filter(x=>x.estado==="porver");document.getElementById("stQueue").textContent=q.length;document.getElementById("ctQ").textContent=q.length||"";
  const sc=L.filter(x=>x.tipo==="serie"&&x.estado==="viendo");document.getElementById("stSeries").textContent=sc.length;document.getElementById("ctS").textContent=sc.length||"";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===tab));
  const v=document.getElementById("view");
  if(tab==="diario"){
    const d=L.filter(x=>x.estado==="vista").sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    if(!d.length){v.innerHTML=empty("Aún no hay sesiones","Cada película o serie que termines queda aquí como una entrada, con nota y reseña. Empieza por la última que viste en Cinesa.","vista");return}
    let html="",cur="";
    d.forEach(x=>{const k=(x.fecha||"").slice(0,7);if(k!==cur){cur=k;html+=`<div class="month">${k?MESL[+k.slice(5)-1]+" "+k.slice(0,4):"Sin fecha"}</div>`}html+=ticket(x)});
    v.innerHTML=`<div class="tickets">${html}</div>`;
  }else if(tab==="porver"){
    const chips=`<div class="chips" role="group" aria-label="Mood"><button class="chip" id="mood-all" data-mood="" aria-pressed="${!mood}">Cualquiera</button>${Object.entries(MOODS).map(([k,l])=>`<button class="chip" id="mood-${k}" data-mood="${k}" aria-pressed="${mood===k}">${l}</button>`).join("")}</div>`;
    let w=q.filter(x=>!mood||(x.moods||[]).includes(mood)).sort((a,b)=>(b.prio?1:0)-(a.prio?1:0)||(b.creado||"").localeCompare(a.creado||""));
    if(!q.length){v.innerHTML=empty("La lista está vacía","Apunta aquí lo que quieras ver: estrenos para gastar el Unlimited, recomendaciones o clásicos pendientes. Etiquétalos por mood para elegir rápido.","porver");return}
    v.innerHTML=`<p class="hint">¿Qué te apetece? Filtra por mood. Las marcadas como «En cartelera» van primero.</p>${chips}<div class="tickets">${w.length?w.map(ticket).join(""):`<p class="hint">Nada con ese mood en tu lista.</p>`}</div>`;
  }else{
    const s=L.filter(x=>x.tipo==="serie"&&x.estado!=="vista"&&x.estado!=="porver");
    const done=L.filter(x=>x.tipo==="serie"&&x.estado==="vista");
    if(!s.length&&!done.length){v.innerHTML=empty("Ninguna serie en marcha","Añade la serie que estés viendo y apunta temporada y capítulo para no perderte nunca.","serie");return}
    v.innerHTML=`<div class="tickets">${s.map(ticket).join("")||`<p class="hint">Ninguna en curso ahora mismo.</p>`}</div>${done.length?`<div class="month">Terminadas</div><div class="tickets">${done.map(ticket).join("")}</div>`:""}`;
  }
}
function empty(h,p,kind){return `<div class="empty"><h2>${h}</h2><p>${p}</p><button class="add" data-new="${kind}">+ Añadir la primera</button></div>`}
function ticket(x){
  const d=x.fecha?new Date(x.fecha+"T12:00"):null;
  const stub=x.estado==="vista"&&d?`<b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span>`:x.tipo==="serie"?`<b>${x.temp?"T"+x.temp:"—"}</b><span>${x.cap?"cap "+x.cap:"serie"}</span>`:`<b>${x.prio?"!":"·"}</b><span>${x.prio?"cartel":"por ver"}</span>`;
  const meta=[x.anio?`<span class="mono">${esc(x.anio)}</span>`:"",x.tipo==="serie"?`<span class="badge alt">Serie</span>`:"",x.donde?`<span class="badge ${x.donde==="cine"?"":"alt"}">${WHERE[x.donde]}</span>`:"",x.plataforma?`<span>${esc(x.plataforma)}</span>`:"",x.rewatch?`<span class="badge alt">Revisionado</span>`:"",x.nota?`<span class="stars">${stars(x.nota)}</span>`:"",x.estado==="porver"&&x.prio?`<span class="badge">En cartelera</span>`:""].filter(Boolean).join("");
  const prog=x.tipo==="serie"&&x.temps&&x.temp&&x.estado==="viendo"?`<div class="prog"><i style="width:${Math.min(100,Math.round((x.temp-1)/x.temps*100+(1/x.temps)*50))}%"></i></div>`:"";
  return `<button class="ticket" data-open="${x.id}"><span class="stub">${stub}</span><span class="body"><h3>${esc(x.titulo)}</h3><span class="meta">${meta}</span>${x.resena?`<p class="rev">${esc(x.resena)}</p>`:""}${prog}</span></button>`;
}

/* Hoja de alta / edición */
let editId=null,draft=null;
function openSheet(id,kind){
  editId=id;
  draft=id?Object.assign({},items[id]):{tipo:kind==="serie"?"serie":"peli",estado:kind==="vista"?"vista":kind==="serie"?"viendo":"porver",titulo:"",anio:"",donde:"cine",plataforma:"",fecha:today(),nota:0,resena:"",rewatch:false,moods:[],prio:false,temp:"",cap:"",temps:""};
  const r=document.getElementById("sheetRoot");
  r.innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shH">
    <h2 id="shH">${id?"Editar":"Nueva entrada"}</h2>
    <div class="seg" role="group" aria-label="Tipo"><button id="ty-peli" data-ty="peli">Película</button><button id="ty-serie" data-ty="serie">Serie</button></div>
    <div class="grid2" style="grid-template-columns:1fr 90px"><div class="field"><label for="fT">Título</label><input type="text" id="fT" value="${esc(draft.titulo)}" placeholder="Título"></div>
    <div class="field"><label for="fY">Año</label><input type="number" id="fY" inputmode="numeric" value="${esc(draft.anio)}" placeholder="2026"></div></div>
    <div class="field"><span class="lbl">Estado</span><div class="seg" role="group" aria-label="Estado"><button id="es-porver" data-es="porver">Por ver</button><button id="es-viendo" data-es="viendo">Viendo</button><button id="es-vista" data-es="vista">Vista</button></div></div>
    <div id="secSerie" class="grid3"><div class="field"><label for="fTp">Temporada</label><input type="number" id="fTp" min="1" value="${esc(draft.temp)}"></div><div class="field"><label for="fCp">Capítulo</label><input type="number" id="fCp" min="1" value="${esc(draft.cap)}"></div><div class="field"><label for="fTs">Temporadas</label><input type="number" id="fTs" min="1" value="${esc(draft.temps)}"></div></div>
    <div id="secVista" style="display:flex;flex-direction:column;gap:14px">
      <div class="grid2"><div class="field"><label for="fD">Fecha</label><input type="date" id="fD" value="${esc(draft.fecha)}"></div>
      <div class="field"><label for="fW">Dónde</label><select id="fW">${Object.entries(WHERE).map(([k,l])=>`<option value="${k}" ${draft.donde===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
      <div class="field"><label for="fR">Nota (como en Letterboxd)</label><div class="rate"><input type="range" id="fR" min="0" max="10" step="1" value="${Math.round((draft.nota||0)*2)}"><output id="fRo">${stars(draft.nota)||"Sin nota"}</output></div></div>
      <div class="field"><label for="fRv">Reseña o apuntes</label><textarea id="fRv">${esc(draft.resena)}</textarea></div>
      <label class="toggle"><input type="checkbox" id="fRw" ${draft.rewatch?"checked":""}> Ya la había visto antes</label>
    </div>
    <div class="field"><label for="fP">Plataforma o cine</label><input type="text" id="fP" value="${esc(draft.plataforma)}" placeholder="Cinesa, Netflix, Max…"></div>
    <div id="secPorver" style="display:flex;flex-direction:column;gap:10px">
      <div class="field"><span class="lbl">Mood</span><div class="chips">${Object.entries(MOODS).map(([k,l])=>`<button class="chip" id="mo-${k}" data-mo="${k}" aria-pressed="${(draft.moods||[]).includes(k)}">${l}</button>`).join("")}</div></div>
      <label class="toggle"><input type="checkbox" id="fPr" ${draft.prio?"checked":""}> En cartelera ahora (para verla con el Unlimited)</label>
    </div>
    ${id?`<div class="links"><a href="${lb(draft)}" target="_blank" rel="noopener">Letterboxd ↗</a><a href="${jw(draft)}" target="_blank" rel="noopener">Dónde verla (JustWatch) ↗</a></div>`:""}
    <div class="actions">${id?`<button class="btn danger" id="del">Eliminar</button>`:"<span></span>"}<span style="display:flex;gap:10px"><button class="btn" id="cancel">Cerrar</button><button class="btn primary" id="save">Guardar</button></span></div>
  </div></div>`;
  const sync=()=>{
    r.querySelectorAll("[data-ty]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ty===draft.tipo));
    r.querySelectorAll("[data-es]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.es===draft.estado));
    document.getElementById("es-viendo").hidden=draft.tipo!=="serie";
    if(draft.tipo!=="serie"&&draft.estado==="viendo")draft.estado="vista";
    document.getElementById("secSerie").hidden=draft.tipo!=="serie"||draft.estado==="porver";
    document.getElementById("secVista").hidden=draft.estado!=="vista";
    document.getElementById("secPorver").hidden=draft.estado!=="porver";
  };
  r.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{draft.tipo=b.dataset.ty;sync()});
  r.querySelectorAll("[data-es]").forEach(b=>b.onclick=()=>{draft.estado=b.dataset.es;sync()});
  r.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{const k=b.dataset.mo;draft.moods=(draft.moods||[]).includes(k)?draft.moods.filter(z=>z!==k):[...(draft.moods||[]),k];b.setAttribute("aria-pressed",draft.moods.includes(k))});
  document.getElementById("fR").oninput=e=>{document.getElementById("fRo").textContent=stars(e.target.value/2)||"Sin nota"};
  document.getElementById("bg").onclick=e=>{if(e.target.id==="bg")close()};
  document.getElementById("cancel").onclick=close;
  if(id){let armed=false;document.getElementById("del").onclick=e=>{if(!armed){armed=true;e.target.textContent="Toca otra vez para eliminar";return}remove(id);close()}}
  document.getElementById("save").onclick=()=>{
    const t=document.getElementById("fT").value.trim();if(!t){document.getElementById("fT").focus();toast("Ponle un título");return}
    const v=k=>document.getElementById(k).value;
    const x={tipo:draft.tipo,estado:draft.estado,titulo:t,anio:v("fY").trim(),plataforma:v("fP").trim(),moods:draft.moods||[],creado:draft.creado||today()};
    if(draft.estado==="vista"){Object.assign(x,{fecha:v("fD"),donde:v("fW"),nota:+v("fR")/2,resena:v("fRv").trim(),rewatch:document.getElementById("fRw").checked})}
    if(draft.estado==="porver")x.prio=document.getElementById("fPr").checked;
    if(draft.tipo==="serie"){x.temp=+v("fTp")||"";x.cap=+v("fCp")||"";x.temps=+v("fTs")||""}
    save(editId,x);close();toast(draft.estado==="vista"?"Entrada guardada":"Guardado");
    tab=x.estado==="vista"?"diario":x.estado==="porver"?"porver":"series";render();
  };
  sync();if(!id)document.getElementById("fT").focus({preventScroll:true});
}
function close(){document.getElementById("sheetRoot").innerHTML="";editId=null}
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

async function save(id,x){
  const r=id?await sb.from("titulos").update(aFila(x)).eq("id",id).select().single():await sb.from("titulos").insert(aFila(x)).select().single();
  if(r.error){toast("No se pudo guardar: "+r.error.message);return}
  items[r.data.id]=deFila(r.data);render();
}
async function remove(id){const r=await sb.from("titulos").delete().eq("id",id);if(r.error){toast("No se pudo eliminar");return}delete items[id];render()}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

document.addEventListener("click",e=>{
  if(e.target.closest(".sheet"))return;let x;
  if(x=e.target.closest("[data-tab]")){tab=x.dataset.tab;try{localStorage.setItem(LS+"-tab",tab)}catch(err){}render();return}
  if(x=e.target.closest("[data-open]")){openSheet(x.dataset.open);return}
  if(x=e.target.closest("[data-new]")){openSheet(null,x.dataset.new);return}
  if(e.target.closest("#addBtn")){openSheet(null,tab==="diario"?"vista":tab==="series"?"serie":"porver");return}
  if(x=e.target.closest("[data-mood]")){mood=x.dataset.mood||null;render();return}
});

/* Letterboxd: CSV de importación (solo películas) */
function csv(rows){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;return rows.map(r=>r.map(q).join(",")).join("\r\n")}
const diaryCSV=()=>csv([["Title","Year","Rating","WatchedDate","Rewatch","Review"],...all().filter(x=>x.tipo==="peli"&&x.estado==="vista").map(x=>[x.titulo,x.anio,x.nota||"",x.fecha||"",x.rewatch?"Yes":"No",x.resena||""])]);
const watchCSV=()=>csv([["Title","Year"],...all().filter(x=>x.tipo==="peli"&&x.estado==="porver").map(x=>[x.titulo,x.anio])]);

function descargar(nombre,texto){const blob=new Blob(["\ufeff"+texto],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
document.getElementById("expDiary").onclick=()=>{descargar("letterboxd-diario.csv",diaryCSV());toast("CSV del diario listo")};
document.getElementById("expWatch").onclick=()=>{descargar("letterboxd-watchlist.csv",watchCSV());toast("CSV de la watchlist listo")};
document.getElementById("salir").onclick=()=>CiccCuenta.salir();
async function cargar(){
  const r=await sb.from("titulos").select("*");
  if(r.error){document.getElementById("view").innerHTML='<p class="cargando">No se pudo cargar. Comprueba la conexión y vuelve a abrir la app.</p>';return}
  items={};r.data.forEach(x=>items[x.id]=deFila(x));listo=true;if(!editId)render();
}
CiccCuenta.iniciar({app:"La Taquilla",icono:"../iconos/la-taquilla-192.png?v=2",lema:"Cada película, una entrada"}).then(async r=>{
  sb=r.sb;CiccCuenta.firma("La Taquilla",document.getElementById("pie"));await cargar();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!editId)cargar()});
});
</script>
</body>
</html>
