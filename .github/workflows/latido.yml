# Mantiene despierta la base de datos (el plan gratuito de Supabase se pausa tras 7 días sin uso).
name: Latido
on:
  schedule:
    - cron: "17 6 */2 * *"   # cada dos días, 06:17 UTC
  workflow_dispatch:
jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl -fsS "https://chgrpztvvbhawzdqscru.supabase.co/rest/v1/latido?select=ultimo" \
            -H "apikey: sb_publishable_Pa4OqudjThAd6DD9sOlKyA_wO1qnrtG"
      - name: Revisar los catálogos de Wetaca y Knoweats (Alacena)
        # si se revisaron hace menos de 3 días la función no hace nada; un fallo aquí no para el latido
        run: |
          curl -sS -X POST "https://chgrpztvvbhawzdqscru.supabase.co/functions/v1/catalogos" \
            -H "apikey: sb_publishable_Pa4OqudjThAd6DD9sOlKyA_wO1qnrtG" \
            -H "Authorization: Bearer sb_publishable_Pa4OqudjThAd6DD9sOlKyA_wO1qnrtG" \
            -H "Content-Type: application/json" -d '{}' || true
