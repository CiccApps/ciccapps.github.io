<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Platea</title>
<meta name="description" content="Diario de cine y series. Una CiccApp.">
<meta name="theme-color" content="#F3EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150D10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Platea">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../iconos/platea-180.png?v=5">
<link rel="icon" type="image/png" href="../iconos/platea-192.png?v=5">
<link rel="stylesheet" href="../compartido/ciccapps.css?v=17">
<style>
/* Layout: marquesina de cine arriba (estadísticas en letras de cartel), pestañas Diario / Por ver / Series, entradas como "tickets" troquelados; formulario en hoja inferior */
:root{
  --bg:#F3EFE4; --card:#FFFFFF; --ink:#24161A; --muted:#6C6266; --line:#E0D7C6;
  --red:#6E1E2B; --red-soft:#F1DEDC; --bulb:#B8913F; --stub:#EDE5D6; --ok:#2E6B4F;
  --f-display:"Limelight","Bebas Neue",Georgia,serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150D10; --card:#1F1518; --ink:#F1E9E4; --muted:#A7999E; --line:#3A2A2F;
  --red:#D27A86; --red-soft:#3A1C22; --bulb:#D9B878; --stub:#2A1C20; --ok:#6CC198; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150D10; --card:#1F1518; --ink:#F1E9E4; --muted:#A7999E; --line:#3A2A2F;
  --red:#D27A86; --red-soft:#3A1C22; --bulb:#D9B878; --stub:#2A1C20; --ok:#6CC198; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.pie-acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px}
.pie-acc .chip{width:100%}
.salir{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);cursor:pointer;padding:6px}
.cargando{padding:48px 0;text-align:center;color:var(--muted)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:0}

.marquee{border-radius:10px;background:radial-gradient(120% 140% at 25% 15%,#8A2A3A,#5E1A26 55%,#3A0E17);color:#FFF6EE;padding:18px 20px 16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.marquee::before,.marquee::after{content:"";position:absolute;left:10px;right:10px;height:6px;background:radial-gradient(circle,var(--bulb) 2.2px,transparent 2.6px) 0 0/14px 6px repeat-x}
.marquee::before{top:6px}.marquee::after{bottom:6px}
.marquee h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,11vw,68px);line-height:1;letter-spacing:.02em;margin:6px 0 0}
.marquee .lema{margin:-2px 0 2px;font-weight:600;font-style:italic;font-size:17px;color:var(--bulb);letter-spacing:.01em}
.marquee .sub{font-size:13px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{display:flex;flex-direction:column;border-left:1px solid rgba(255,246,238,.35);padding-left:10px;min-width:0}
.stats b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1}
.stats span{font-size:11.5px;opacity:.85}
@media (max-width:520px){.stats{gap:6px}.stats div{padding-left:7px}.stats b{font-size:28px}.stats span{font-size:10.5px;line-height:1.25}.marquee{padding:16px 16px 18px}}

.bar{display:flex;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px}
.tabs{display:flex;gap:4px;background:var(--stub);padding:4px;border-radius:10px;flex:1;min-width:0}
.tab{flex:1;padding:9px 4px;white-space:nowrap;border:none;border-radius:7px;background:transparent;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tab .ct{font-family:var(--f-mono);font-size:11px;color:var(--red);margin-left:4px}
@media (max-width:400px){.addtxt{display:none}.add{padding:11px 15px;font-size:18px;line-height:1}.tab{font-size:13px}}
.add{border:none;background:var(--ink);color:var(--bg);font-weight:700;padding:11px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);color:#FFF6EE;border-color:var(--red)}
:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}

.month{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;color:var(--muted);margin:8px 0 -6px}
.tickets{display:flex;flex-direction:column;gap:10px}
.ticket{display:grid;grid-template-columns:64px 1fr;background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;width:100%;padding:0;overflow:hidden;position:relative}
.ticket .stub{background:var(--stub);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border-right:2px dashed var(--line);gap:0}
.ticket .stub b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:400}
.ticket .stub span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ticket .body{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ticket h3{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.ticket .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ticket .rev{font-size:13.5px;color:var(--ink);opacity:.85;margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--bulb);letter-spacing:1px;font-size:13px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--red-soft);color:var(--red)}
.badge.alt{background:var(--stub);color:var(--muted)}
.prog{height:4px;background:var(--stub);border-radius:2px;overflow:hidden;margin-top:6px;max-width:260px}
.prog i{display:block;height:100%;background:var(--red)}
.empty{border:2px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;letter-spacing:.03em}
.empty p{margin:0;color:var(--muted);max-width:44ch}

.sheet-bg{position:fixed;inset:0;background:rgba(10,6,8,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:12px 12px 0 0;max-height:92%;overflow:auto;border-top:5px solid var(--red);
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;letter-spacing:.03em;line-height:1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:8px}
.seg button{flex:1;font-size:13px;padding:8px 4px;border:none;border-radius:6px;background:transparent;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700}
.rate{display:flex;align-items:center;gap:10px}
.rate input{flex:1;accent-color:var(--bulb)}
.rate output{font-family:var(--f-mono);min-width:70px;color:var(--bulb)}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--red)}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{font-weight:700;font-size:14px;padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--red);border-color:transparent;padding-left:0}
.links{display:flex;gap:16px;flex-wrap:wrap}
.links a{color:var(--red);font-weight:700;font-size:14px;text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;white-space:nowrap}
footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
@media (min-width:760px){.sheet-bg{align-items:center;padding:24px}.sheet{border-radius:12px;max-height:86vh}}

.look{position:relative}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.sug button{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink);font:inherit}
.sug button:last-child{border-bottom:0}
.sug img,.sug i{width:38px;height:56px;object-fit:cover;border-radius:3px;background:var(--stub);display:block}
.sug b{font-weight:700;font-size:14px;display:block}.sug span span{font-size:12px;color:var(--muted)}
.pv{display:flex;gap:12px;align-items:center}.pv img{width:54px;height:80px;object-fit:cover;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.2)}.pv .hint{margin:0}
.ticket.con-poster{grid-template-columns:64px 1fr 58px}
.ticket .poster{width:58px;height:100%;min-height:84px;object-fit:cover;display:block;border-left:1px solid var(--line)}
.anio-btn{align-self:flex-start;border:1px solid rgba(255,246,238,.5);background:transparent;color:#FFF6EE;border-radius:999px;padding:6px 14px;font:700 13px var(--f-body);cursor:pointer;margin-top:4px}
.anio h2{font-size:56px}
.res-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.res-btns .anio-btn{margin-top:0}
.anio-btn.nuevo{background:#FFF6EE;color:var(--red);border-color:#FFF6EE}
.mes-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.mes-row .mono{color:var(--muted);font-size:13px;width:20px;flex:none}.mes-row img{width:30px;height:45px;object-fit:cover;border-radius:3px;flex:none}.mes-row b{flex:1;min-width:0;font-weight:600}.mes-row .stars{flex:none;white-space:nowrap}
.an-cmp{font-size:13px;color:var(--muted);margin:-4px 0 0}
.an-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.an-grid div{background:var(--stub);border-radius:8px;padding:12px 10px;display:flex;flex-direction:column}
.an-grid b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}.an-grid span{font-size:11.5px;color:var(--muted)}
.an-mes{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:110px;align-items:end}
.an-mes div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px;text-align:center}
.an-mes i{display:block;background:var(--red);border-radius:3px 3px 0 0;min-height:2px}.an-mes span{font-size:10px;color:var(--muted)}
.an-frase{margin:0;font-size:15px}
.an-top{display:flex;flex-direction:column;gap:8px}
.an-row{display:flex;gap:10px;align-items:center}.an-row>.mono{width:18px;flex:none}.an-row img{flex:none}.an-row b{flex:1;min-width:0}.an-row .stars{flex:none;white-space:nowrap}
.an-row img{width:32px;height:48px;object-fit:cover;border-radius:3px}.an-row b{font-weight:700;font-size:14px}
.ia{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:18px;border-radius:10px;background:var(--card);border:1px solid var(--line);position:relative}
.ia::before{content:"";position:absolute;left:10px;right:10px;top:6px;height:6px;background:radial-gradient(circle,var(--bulb) 2.2px,transparent 2.6px) 0 0/14px 6px repeat-x;opacity:.7}
.ia .eyebrow{margin-top:8px}
.ia h2{font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:.03em;line-height:1;margin:0}
.ia textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;resize:vertical;min-height:84px}
.ia textarea:focus{outline:2px solid var(--bulb);outline-offset:1px}
.ia-go{width:100%}
.ia-list{display:flex;flex-direction:column;gap:10px}
.ia-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.ia-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.ia-item h3{margin:0;font-size:17px;font-weight:700}
.ia-meta{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.ia-why{margin:0;font-size:13.5px;opacity:.85}
.ia-add{align-self:flex-start;padding:8px 12px;font-size:13px}
.ia-ok{font-size:13px;font-weight:700;color:var(--ok)}
@media (min-width:900px){.ia-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Limelight solo para títulos: las cifras van en Manrope para que se lean bien */
.stats b,.ticket .stub b,.an-grid b{font-family:var(--f-body)!important;font-weight:800;letter-spacing:-.01em}
/* ===== CiccApps · rejilla común (márgenes y ancho); la tipografía y el carácter son de cada app ===== */
.wrap{max-width:1040px!important;margin-inline:auto!important;padding-block:28px 72px!important;padding-left:max(20px,env(safe-area-inset-left,0px))!important;padding-right:max(20px,env(safe-area-inset-right,0px))!important}
@media (min-width:768px){.wrap{padding-top:44px!important;padding-left:max(32px,env(safe-area-inset-left,0px))!important;padding-right:max(32px,env(safe-area-inset-right,0px))!important}}
.cc-firma{padding-top:24px}
.dia{display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){.tickets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tickets>.ticket:last-child:nth-child(odd){grid-column:1/-1}}
</style>

</head>
<body>
<div class="wrap">
  <section class="marquee" aria-label="Resumen">
    <span class="eyebrow" style="color:#FFF6EE;opacity:.8;margin-top:6px">Diario de cine y series</span>
    <h1>Platea</h1>
    <p class="lema">¿Qué veo hoy?</p>
    <div class="stats">
      <div><b id="stYear" class="mono">0</b><span>películas este año</span></div>
      <div><b id="stCine" class="mono">0</b><span>en el cine este mes</span></div>
      <div><b id="stQueue" class="mono">0</b><span>por ver</span></div>
      <div><b id="stSeries" class="mono">0</b><span>series en curso</span></div>
    </div>
    <div class="res-btns"><button class="anio-btn" id="mesBtn" type="button">Tu mes →</button><button class="anio-btn" id="anioBtn" type="button">Tu año en cine →</button></div>
  </section>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-diario" data-tab="diario" aria-selected="true">Diario</button>
      <button class="tab" role="tab" id="tab-porver" data-tab="porver" aria-selected="false">Por ver<span class="ct" id="ctQ"></span></button>
      <button class="tab" role="tab" id="tab-series" data-tab="series" aria-selected="false">Series<span class="ct" id="ctS"></span></button>
    </div>
    <button class="add" id="addBtn" aria-label="Añadir">+<span class="addtxt"> Añadir</span></button>
  </div>

  <div id="view" style="display:flex;flex-direction:column;gap:16px"><p class="cargando">Abriendo la platea…</p></div>

  <footer id="pie" style="flex-direction:column;align-items:center">
    <div class="pie-acc"><button class="chip" id="expDiary">Exportar diario</button><button class="chip" id="expWatch">Exportar watchlist</button></div>
    <span id="sync" style="text-align:center">Archivos CSV para importar en Letterboxd · sincronizado en todos tus dispositivos.</span>
    <button class="salir" id="salir">Cerrar sesión</button>
  </footer>
</div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="../compartido/supabase.js"></script>
<script src="../compartido/cuenta.js?v=17"></script>
<script>
const MOODS={risa:"Reírme",tension:"Tensión",pensar:"Pensar",llorar:"Emocionarme",accion:"Acción",epico:"Épica",ligera:"Ligera",clasico:"Clásico pendiente"};
const WHERE={cine:"Cine",streaming:"Streaming",casa:"En casa"};
let syncSheet=null;
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let items={};let tab="diario";let mood=null;let sb=null;let listo=false;
const LS="sala-miguel-v1";
try{const t=localStorage.getItem(LS+"-tab");if(t)tab=t}catch(e){}
/* filas de la base de datos <-> entradas */
const deFila=r=>({tipo:r.tipo,estado:r.estado,titulo:r.titulo,anio:r.anio?String(r.anio):"",donde:r.donde||"",plataforma:r.plataforma||"",fecha:r.fecha||"",nota:+r.nota||0,resena:r.resena||"",rewatch:r.rewatch,moods:r.moods||[],prio:r.prio,temp:r.temporada||"",cap:r.capitulo||"",temps:r.temporadas||"",creado:r.creado,poster:r.poster||"",tmdb_id:r.tmdb_id||null});
const aFila=x=>({tipo:x.tipo,estado:x.estado,titulo:x.titulo,anio:parseInt(x.anio,10)||null,donde:x.donde||null,plataforma:x.plataforma||null,fecha:x.fecha||null,nota:x.nota||null,resena:x.resena||null,rewatch:!!x.rewatch,moods:x.moods||[],prio:!!x.prio,temporada:+x.temp||null,capitulo:+x.cap||null,temporadas:+x.temps||null,poster:x.poster||null,tmdb_id:x.tmdb_id||null});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const stars=n=>n?"★".repeat(Math.floor(n))+(n%1?"½":""):"";
const lb=x=>`https://letterboxd.com/search/${encodeURIComponent(x.titulo+(x.anio?" "+x.anio:""))}/`;
const jw=x=>`https://www.justwatch.com/es/buscar?q=${encodeURIComponent(x.titulo)}`;
const all=()=>Object.entries(items).map(([id,x])=>Object.assign({id},x));

function render(){
  if(!listo)return;
  const L=all();const y=today().slice(0,4),m=today().slice(0,7);
  const seen=L.filter(x=>x.tipo==="peli"&&x.estado==="vista");
  document.getElementById("stYear").textContent=seen.filter(x=>(x.fecha||"").startsWith(y)).length;
  document.getElementById("stCine").textContent=seen.filter(x=>x.donde==="cine"&&(x.fecha||"").startsWith(m)).length;
  const q=L.filter(x=>x.estado==="porver");document.getElementById("stQueue").textContent=q.length;document.getElementById("ctQ").textContent=q.length||"";
  const sc=L.filter(x=>x.tipo==="serie"&&x.estado==="viendo");document.getElementById("stSeries").textContent=sc.length;document.getElementById("ctS").textContent=sc.length||"";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===tab));
  const v=document.getElementById("view");
  if(tab==="diario"){
    const d=L.filter(x=>x.estado==="vista").sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    if(!d.length){v.innerHTML=empty("Aún no hay sesiones","Cada película o serie que termines queda aquí como una entrada, con nota y reseña. Empieza por la última que viste en Cinesa.","vista");return}
    let html="",cur=null;
    d.forEach(x=>{const k=(x.fecha||"").slice(0,7);if(k!==cur){if(cur!==null)html+=`</div>`;cur=k;html+=`<div class="month">${k?MESL[+k.slice(5)-1]+" "+k.slice(0,4):"Sin fecha"}</div><div class="tickets">`}html+=ticket(x)});
    if(cur!==null)html+=`</div>`;
    v.innerHTML=`<div class="dia">${html}</div>`;
  }else if(tab==="porver"){
    const chips=`<div class="chips" role="group" aria-label="Mood"><button class="chip" id="mood-all" data-mood="" aria-pressed="${!mood}">Cualquiera</button>${Object.entries(MOODS).map(([k,l])=>`<button class="chip" id="mood-${k}" data-mood="${k}" aria-pressed="${mood===k}">${l}</button>`).join("")}</div>`;
    let w=q.filter(x=>!mood||(x.moods||[]).includes(mood)).sort((a,b)=>(b.prio?1:0)-(a.prio?1:0)||(b.creado||"").localeCompare(a.creado||""));
    if(!q.length){v.innerHTML=empty("La lista está vacía","Apunta aquí lo que quieras ver: estrenos para gastar el Unlimited, recomendaciones o clásicos pendientes. Etiquétalos por mood para elegir rápido.","porver")+viewIA();return}
    v.innerHTML=`<p class="hint">¿Qué te apetece? Filtra por mood. Las marcadas como «En cartelera» van primero.</p>${chips}<div class="tickets">${w.length?w.map(ticket).join(""):`<p class="hint">Nada con ese mood en tu lista.</p>`}</div>${viewIA()}`;
  }else{
    const s=L.filter(x=>x.tipo==="serie"&&x.estado!=="vista"&&x.estado!=="porver");
    const done=L.filter(x=>x.tipo==="serie"&&x.estado==="vista");
    if(!s.length&&!done.length){v.innerHTML=empty("Ninguna serie en marcha","Añade la serie que estés viendo y apunta temporada y capítulo para no perderte nunca.","serie");return}
    v.innerHTML=`<div class="tickets">${s.map(ticket).join("")||`<p class="hint">Ninguna en curso ahora mismo.</p>`}</div>${done.length?`<div class="month">Terminadas</div><div class="tickets">${done.map(ticket).join("")}</div>`:""}`;
  }
}
function empty(h,p,kind){return `<div class="empty"><h2>${h}</h2><p>${p}</p><button class="add" data-new="${kind}">+ Añadir la primera</button></div>`}
function ticket(x){
  const d=x.fecha?new Date(x.fecha+"T12:00"):null;
  const stub=x.estado==="vista"&&d?`<b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span>`:x.tipo==="serie"?`<b>${x.temp?"T"+x.temp:"—"}</b><span>${x.cap?"cap "+x.cap:"serie"}</span>`:`<b>${x.prio?"!":"·"}</b><span>${x.prio?"cartel":"por ver"}</span>`;
  const meta=[x.anio?`<span class="mono">${esc(x.anio)}</span>`:"",x.tipo==="serie"?`<span class="badge alt">Serie</span>`:"",x.donde?`<span class="badge ${x.donde==="cine"?"":"alt"}">${WHERE[x.donde]}</span>`:"",x.plataforma?`<span>${esc(x.plataforma)}</span>`:"",x.rewatch?`<span class="badge alt">Revisionado</span>`:"",x.nota?`<span class="stars">${stars(x.nota)}</span>`:"",x.estado==="porver"&&x.prio?`<span class="badge">En cartelera</span>`:""].filter(Boolean).join("");
  const prog=x.tipo==="serie"&&x.temps&&x.temp&&x.estado==="viendo"?`<div class="prog"><i style="width:${Math.min(100,Math.round((x.temp-1)/x.temps*100+(1/x.temps)*50))}%"></i></div>`:"";
  return `<button class="ticket${x.poster?" con-poster":""}" data-open="${x.id}"><span class="stub">${stub}</span><span class="body"><h3>${esc(x.titulo)}</h3><span class="meta">${meta}</span>${x.resena?`<p class="rev">${esc(x.resena)}</p>`:""}${prog}</span>${x.poster?`<img class="poster" src="${esc(x.poster)}" alt="" loading="lazy">`:""}</button>`;
}

async function save(id,x){
  const r=id?await sb.from("titulos").update(aFila(x)).eq("id",id).select().single():await sb.from("titulos").insert(aFila(x)).select().single();
  if(r.error){toast("No se pudo guardar: "+r.error.message);return}
  items[r.data.id]=deFila(r.data);render();
}
async function remove(id){const r=await sb.from("titulos").delete().eq("id",id);if(r.error){toast("No se pudo eliminar");return}delete items[id];render()}


/* Buscar película o serie: póster, año, tipo y plataforma */
function conectarFicha(){
  const q=document.getElementById("fQ"),sug=document.getElementById("fSug"),pv=document.getElementById("fPv");let tm,res=[];
  const pinta=()=>{sug.hidden=!res.length;sug.innerHTML=res.map((x,i)=>`<button type="button" data-fi="${i}">${x.poster?`<img src="${esc(x.poster)}" alt="" loading="lazy">`:"<i></i>"}<span><b>${esc(x.titulo)}</b><span>${[x.anio,x.tipo==="serie"?"Serie":"Película",x.plataforma].filter(Boolean).map(esc).join(" · ")}</span></span></button>`).join("")};
  sug.onclick=e=>{const t=e.target.closest("[data-fi]");if(!t)return;const x=res[+t.dataset.fi];
    draft.titulo=x.titulo;draft.anio=x.anio?String(x.anio):"";draft.tipo=x.tipo;draft.poster=x.poster;draft.tmdb_id=x.tmdb_id;if(x.plataforma&&!document.getElementById("fP").value)document.getElementById("fP").value=x.plataforma;
    document.getElementById("fT").value=x.titulo;document.getElementById("fY").value=draft.anio;
    document.querySelectorAll("[data-ty]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ty===draft.tipo));
    if(typeof syncSheet==="function")syncSheet();
    pv.hidden=!x.poster;pv.innerHTML=x.poster?`<img src="${esc(x.poster)}" alt=""><span class="hint">${esc([x.anio,x.plataforma].filter(Boolean).join(" · ")||"Póster y datos rellenados")}</span>`:"";
    sug.hidden=true;q.value="";toast("Datos rellenados")};
  q.oninput=()=>{clearTimeout(tm);const v=q.value.trim();if(v.length<2){res=[];pinta();return}
    tm=setTimeout(async()=>{try{const r=await sb.functions.invoke("ficha",{body:{q:v}});res=(r.data&&r.data.resultados)||[];pinta()}catch(_){}} ,350)};
}

/* Tu mes: del 1 al 7 enseña el mes que acaba de terminar; el resto, el mes en curso */
function mesResumen(){const d=new Date();if(d.getDate()<=7)d.setDate(0);return {y:d.getFullYear(),m:d.getMonth(),cerrado:new Date().getDate()<=7}}
function tuMes(){
  const {y:yy,m,cerrado}=mesResumen();const pre=yy+"-"+String(m+1).padStart(2,"0");
  const ant=new Date(yy,m-1,1);const preA=ant.getFullYear()+"-"+String(ant.getMonth()+1).padStart(2,"0");
  const vis=all().filter(x=>x.estado==="vista");const V=vis.filter(x=>String(x.fecha||"").startsWith(pre));const nA=vis.filter(x=>String(x.fecha||"").startsWith(preA)).length;
  const pelis=V.filter(x=>x.tipo==="peli").length,series=V.filter(x=>x.tipo==="serie").length,cine=V.filter(x=>x.donde==="cine").length;
  const notas=V.filter(x=>x.nota>0);const media=notas.length?notas.reduce((a,x)=>a+x.nota,0)/notas.length:0;
  const mejor=[...notas].sort((a,b)=>b.nota-a.nota)[0];
  const plats={};V.forEach(x=>{const k=x.donde==="cine"?"el cine":(x.plataforma||"").split(",")[0].trim();if(k)plats[k]=(plats[k]||0)+1});const topP=Object.entries(plats).sort((a,b)=>b[1]-a[1])[0];
  const dif=V.length-nA;const cmp=nA||V.length?(dif>0?`${dif} más que en ${MESL[ant.getMonth()].toLowerCase()}`:dif<0?`${-dif} menos que en ${MESL[ant.getMonth()].toLowerCase()}`:`Igual que en ${MESL[ant.getMonth()].toLowerCase()}`):"";
  const lista=[...V].sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
  const r=document.getElementById("sheetRoot");
  r.innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet anio" role="dialog" aria-modal="true" aria-labelledby="anH">
    <span class="eyebrow">${cerrado?"Tu resumen del mes":"Tu mes hasta hoy"}</span><h2 id="anH">${MESL[m]}</h2>
    ${V.length?`<div class="an-grid"><div><b>${pelis}</b><span>películas</span></div><div><b>${series}</b><span>series</span></div><div><b>${cine}</b><span>en el cine</span></div><div><b>${media?media.toFixed(1):"—"}</b><span>nota media</span></div></div>
    ${cmp?`<p class="an-cmp">${cmp}.</p>`:""}
    <p class="an-frase">${mejor?`Lo mejor del mes: <b>${esc(mejor.titulo)}</b> <span class="stars">${stars(mejor.nota)}</span>`:"Aún no has puntuado nada este mes"}${topP?`. Donde más viste: <b>${esc(topP[0])}</b>`:""}.</p>
    <div class="an-top"><span class="eyebrow">Lo que viste</span>${lista.map(x=>`<div class="mes-row"><span class="mono">${x.fecha.slice(8,10)}</span>${x.poster?`<img src="${esc(x.poster)}" alt="">`:""}<b>${esc(x.titulo)}</b>${x.nota?`<span class="stars">${stars(x.nota)}</span>`:""}</div>`).join("")}</div>`
    :`<p class="hint">${cerrado?"No apuntaste nada ese mes.":"Aún no has apuntado nada este mes."} Cuando lo hagas, aquí verás tu resumen.</p>`}
    <div class="sheet-actions"><button class="add" id="anClose">Cerrar</button></div></div></div>`;
  document.getElementById("bg").onclick=e=>{if(e.target.id==="bg")r.innerHTML=""};document.getElementById("anClose").onclick=()=>r.innerHTML="";
  try{localStorage.setItem("platea-mes-visto",pre)}catch(_){}document.getElementById("mesBtn").classList.remove("nuevo");
}
function marcarMesNuevo(){const {y:yy,m,cerrado}=mesResumen();const b=document.getElementById("mesBtn");if(!b)return;
  b.textContent=(cerrado?"Tu "+MESL[m].toLowerCase():"Tu mes")+" →";
  let v=null;try{v=localStorage.getItem("platea-mes-visto")}catch(_){}b.classList.toggle("nuevo",cerrado&&v!==yy+"-"+String(m+1).padStart(2,"0"))}

/* Tu año en cine */
function anioEnCine(){
  const y=new Date().getFullYear();const V=all().filter(x=>x.estado==="vista"&&String(x.fecha||"").startsWith(String(y)));
  const pelis=V.filter(x=>x.tipo==="peli"),series=V.filter(x=>x.tipo==="serie");
  const cine=V.filter(x=>x.donde==="cine").length;const notas=V.filter(x=>x.nota>0);
  const media=notas.length?(notas.reduce((a,x)=>a+x.nota,0)/notas.length):0;
  const porMes=Array(12).fill(0);V.forEach(x=>porMes[+x.fecha.slice(5,7)-1]++);const max=Math.max(1,...porMes);
  const mejorMes=porMes.indexOf(Math.max(...porMes));
  const plats={};V.forEach(x=>{const k=x.donde==="cine"?"Cine":(x.plataforma||"").split(",")[0].trim();if(k)plats[k]=(plats[k]||0)+1});
  const topP=Object.entries(plats).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const moods={};V.forEach(x=>(x.moods||[]).forEach(m=>moods[m]=(moods[m]||0)+1));const topM=Object.entries(moods).sort((a,b)=>b[1]-a[1])[0];
  const top=[...notas].sort((a,b)=>b.nota-a.nota).slice(0,5);
  const r=document.getElementById("sheetRoot");
  r.innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet anio" role="dialog" aria-modal="true" aria-labelledby="anH">
    <span class="eyebrow">Tu año en cine</span><h2 id="anH">${y}</h2>
    ${V.length?`<div class="an-grid"><div><b>${pelis.length}</b><span>películas</span></div><div><b>${series.length}</b><span>series</span></div><div><b>${cine}</b><span>en el cine</span></div><div><b>${media?media.toFixed(1):"—"}</b><span>nota media</span></div></div>
    <div class="an-mes" aria-label="Por meses">${porMes.map((n,i)=>`<div title="${MESL[i]}: ${n}"><i style="height:${n/max*100}%"></i><span>${MES[i].slice(0,1)}</span></div>`).join("")}</div>
    <p class="an-frase">Tu mes más cinéfilo fue <b>${MESL[mejorMes].toLowerCase()}</b>${topP.length?`, y donde más viste fue <b>${esc(topP[0][0])}</b>`:""}${topM?`. Tu mood del año: <b>${esc(MOODS[topM[0]]||topM[0])}</b>`:""}.</p>
    ${top.length?`<div class="an-top"><span class="eyebrow">Tus mejor valoradas</span>${top.map((x,i)=>`<div class="an-row"><span class="mono">${i+1}</span>${x.poster?`<img src="${esc(x.poster)}" alt="">`:""}<b>${esc(x.titulo)}</b><span class="stars">${stars(x.nota)}</span></div>`).join("")}</div>`:""}`
    :`<p class="hint">Aún no hay nada visto este año. Cuando apuntes tus primeras entradas, aquí verás tu resumen.</p>`}
    <div class="sheet-actions"><button class="add" id="anClose">Cerrar</button></div></div></div>`;
  document.getElementById("bg").onclick=e=>{if(e.target.id==="bg")r.innerHTML=""};document.getElementById("anClose").onclick=()=>r.innerHTML="";
}

/* Créame una watchlist (IA) */
const IA={res:[],info:"",busy:false,txt:""};
function viewIA(){
  const res=IA.res.map((l,i)=>`<article class="ia-item"><div class="ia-top"><h3>${esc(l.titulo)}</h3><span class="ia-meta">${l.anio?`<span class="mono">${l.anio}</span>`:""}<span class="badge ${l.donde==="cine"?"":"alt"}">${l.tipo==="serie"?"Serie":l.donde==="cine"?"En cines":"Película"}</span>${l.plataforma?`<span class="badge alt">${esc(l.plataforma)}</span>`:""}</span></div>
    ${l.por_que?`<p class="ia-why">${esc(l.por_que)}</p>`:""}
    ${l.added?`<span class="ia-ok">En tu lista «Por ver»</span>`:`<button class="add ia-add" data-ia-add="${i}">Añadir a Por ver</button>`}</article>`).join("");
  return `<section class="ia" aria-labelledby="iaH"><span class="eyebrow">Con inteligencia artificial</span><h2 id="iaH">Créame una watchlist</h2>
    <p class="hint">Cuéntame qué te apetece y te propongo diez películas o series que no tengas ya apuntadas.</p>
    <textarea id="iaTxt" rows="3" maxlength="400" placeholder="Por ejemplo: thrillers de los 90 para ver en pareja">${esc(IA.txt)}</textarea>
    <button class="add ia-go" id="iaGo" ${IA.busy?"disabled":""}>${IA.busy?"Pensando…":"Créame una watchlist"}</button>
    ${IA.info?`<p class="hint">${esc(IA.info)}</p>`:""}${res?`<div class="ia-list">${res}</div>`:""}</section>`;
}
async function pedirIA(){
  const t=(document.getElementById("iaTxt")||{}).value||"";IA.txt=t;
  if(t.trim().length<3){toast("Cuéntame qué te apetece");return}
  IA.busy=true;IA.info="";render();
  const L=all();const vistos=L.filter(x=>x.estado==="vista").map(x=>x.titulo+(x.anio?` (${x.anio})`:""));const pend=L.filter(x=>x.estado!=="vista").map(x=>x.titulo);
  try{const r=await sb.functions.invoke("ia-lista",{body:{tipo:"cine",peticion:t,leidos:vistos,pendientes:pend}});
    if(r.error){let m="La IA no ha podido responder. Prueba en un rato.";try{const j=await r.error.context.json();if(j&&j.mensaje)m=j.mensaje}catch(_){}IA.info=m}
    else{IA.res=r.data.items||[];const q=r.data.limite-r.data.usados;IA.info=q>0?`Te quedan ${q} ${q===1?"lista":"listas"} este mes.`:"Era tu última lista de este mes."}
  }catch(err){IA.info="No se pudo conectar con la IA."}
  IA.busy=false;render();
}
async function anadirIA(i){const l=IA.res[i];if(!l||l.added)return;
  let f=null;try{const r=await sb.functions.invoke("ficha",{body:{q:l.titulo}});f=(r.data&&r.data.resultados||[]).find(z=>!l.anio||!z.anio||Math.abs(z.anio-l.anio)<=1)||null}catch(_){}
  const x={poster:f&&f.poster||null,tmdb_id:f&&f.tmdb_id||null,tipo:l.tipo,estado:"porver",titulo:l.titulo,anio:l.anio||"",donde:l.donde,plataforma:l.plataforma||"",fecha:null,nota:0,resena:"",rewatch:false,moods:l.moods||[],prio:l.donde==="cine"};
  const r=await sb.from("titulos").insert(aFila(x)).select().single();if(r.error){toast("No se pudo añadir");return}
  l.added=true;toast("Añadida a Por ver");cargar();}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

document.addEventListener("click",e=>{
  if(e.target.closest(".sheet"))return;let x;
  if(x=e.target.closest("[data-tab]")){tab=x.dataset.tab;try{localStorage.setItem(LS+"-tab",tab)}catch(err){}render();return}
  if(x=e.target.closest("[data-open]")){openSheet(x.dataset.open);return}
  if(x=e.target.closest("[data-new]")){openSheet(null,x.dataset.new);return}
  if(e.target.closest("#addBtn")){openSheet(null,tab==="diario"?"vista":tab==="series"?"serie":"porver");return}
  if(x=e.target.closest("[data-mood]")){mood=x.dataset.mood||null;render();return}
  if(e.target.closest("#iaGo")){pedirIA();return}
  if(e.target.closest("#anioBtn")){anioEnCine();return}
  if(e.target.closest("#mesBtn")){tuMes();return}
  if(x=e.target.closest("[data-ia-add]")){anadirIA(+x.dataset.iaAdd);return}
});

/* Letterboxd: CSV de importación (solo películas) */
function csv(rows){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;return rows.map(r=>r.map(q).join(",")).join("\r\n")}
const diaryCSV=()=>csv([["Title","Year","Rating","WatchedDate","Rewatch","Review"],...all().filter(x=>x.tipo==="peli"&&x.estado==="vista").map(x=>[x.titulo,x.anio,x.nota||"",x.fecha||"",x.rewatch?"Yes":"No",x.resena||""])]);
const watchCSV=()=>csv([["Title","Year"],...all().filter(x=>x.tipo==="peli"&&x.estado==="porver").map(x=>[x.titulo,x.anio])]);

function descargar(nombre,texto){const blob=new Blob(["\ufeff"+texto],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
document.getElementById("expDiary").onclick=()=>{descargar("letterboxd-diario.csv",diaryCSV());toast("CSV del diario listo")};
document.getElementById("expWatch").onclick=()=>{descargar("letterboxd-watchlist.csv",watchCSV());toast("CSV de la watchlist listo")};
document.addEventListener("input",e=>{if(e.target.id==="iaTxt")IA.txt=e.target.value});
document.getElementById("salir").onclick=()=>CiccCuenta.salir();
async function cargar(){
  const r=await sb.from("titulos").select("*");
  if(r.error){document.getElementById("view").innerHTML='<p class="cargando">No se pudo cargar. Comprueba la conexión y vuelve a abrir la app.</p>';return}
  items={};r.data.forEach(x=>items[x.id]=deFila(x));listo=true;if(!editId)render();
}
const TEMA_ACCESO={claro:{fondo:"#F3EFE4","fondo-alto":"#FFFFFF",hundido:"#EDE5D6",linea:"#E0D7C6","linea-fuerte":"#9C8F92",tinta:"#24161A","tinta-suave":"#6C6266",oro:"#6E1E2B",primario:"#6E1E2B","sobre-primario":"#FFF6EE","display-app":'"Limelight",Georgia,serif',"display-tracking":".02em"},
  oscuro:{fondo:"#150D10","fondo-alto":"#1F1518",hundido:"#2A1C20",linea:"#3A2A2F","linea-fuerte":"#6B5A5F",tinta:"#F1E9E4","tinta-suave":"#A7999E",oro:"#D9B878",primario:"#B8475A","sobre-primario":"#FFF6EE","display-app":'"Limelight",Georgia,serif',"display-tracking":".02em"}};
CiccCuenta.iniciar({app:"Platea",icono:"../iconos/platea-192.png?v=5",lema:"¿Qué veo hoy?",tema:TEMA_ACCESO}).then(async r=>{
  sb=r.sb;CiccCuenta.firma("Platea",document.getElementById("pie"));await cargar();marcarMesNuevo();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!editId)cargar()});
});
